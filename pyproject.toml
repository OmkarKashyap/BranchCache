[project]
name = "branch-cache-agent"
version = "0.1.0"
description = "Tree-structured, test-driven best-of-N code-repair agent benchmarked across naive/vLLM/SGLang serving strategies"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "pytest>=8.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "openai>=1.30",
    "requests>=2.31",
]

# GPU-only deps: installed on Colab/Kaggle for serving benchmarks, never in CPU CI.
[project.optional-dependencies]
gpu = [
    "vllm",
    "sglang",
]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "serving*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
